ontology_schema:
  name: StockTurnScenario
  description: 원인 기반 주식 투자 학습 게임의 고정 시나리오 도메인 모델 — 세트(A/B/C), 턴(월), 가상 기업의 5개 지표, 주가 변동, 수치 기여도가 명시된 원인 카드, 개인 현금흐름 상태를 표현한다.
  fields:
    - name: scenario_set_id
      type: string
      description: 시나리오 세트 식별자 (A/B/C)
      required: true
    - name: turn_index
      type: number
      description: 턴 번호 = 게임 내 개월 (세션당 3~5)
      required: true
    - name: companies
      type: array
      description: 가상 기업 3개 목록
      required: true
    - name: indicators
      type: object
      description: "기업 지표 5종: 매출, 영업이익, 부채비율, PER, 외국인·기관 순매수"
      required: true
    - name: price_change_rate
      type: number
      description: 해당 턴 기업의 실제 주가 변동률(%)
      required: true
    - name: cause_cards
      type: array
      description: 변동에 연결된 원인 카드 목록; 각 카드는 label, impact_ticks(%p), linked_indicator 포함
      required: true
    - name: impact_ticks
      type: number
      description: 원인 카드의 수치 기여도(%p); 절댓값 최댓값이 정답 원인
      required: true
    - name: linked_indicator
      type: string
      description: 원인 카드가 연결된 지표
      required: true
    - name: correct_cause_id
      type: string
      description: 기여도 절댓값이 가장 큰 유일한 정답 원인 카드 id
      required: true
    - name: cashflow
      type: object
      description: "개인 현금흐름 상태: 월급, 생활비, 현금, 투자금, 손익"
      required: true
    - name: player_action
      type: string
      description: "턴 선택: 매수/보유/매도/보류"
      required: true
    - name: quiz_target_company
      type: string
      description: 턴당 1회 채점 대상 기업 (투자 기업, 없으면 변동폭 절댓값 최대 기업)
      required: true

evaluation_principles:
  - name: 원인-지표 연결성
    description: 모든 주가 변동이 사전 정의된 원인 카드 및 연결 지표로 설명되어 "지표와 함께 이해" 목표를 충족하는가
    weight: 0.3
  - name: 데이터 정합성
    description: 기여도 합 = 변동률, 정답 원인 유일성 등 불변식이 자동 검증을 통과하는가
    weight: 0.25
  - name: 학습 측정 가능성
    description: 선택→공개 채점 흐름과 결산 집계가 성공 기준을 관찰자가 측정할 수 있게 만드는가
    weight: 0.2
  - name: 검증 접근성
    description: 설치 없이 링크로 4명 검증자가 15분 내 완주 가능한 정적 웹으로 배포되는가
    weight: 0.15
  - name: MVP 범위 준수
    description: 경험치·레벨업·부동산·서버 등 제외 범위를 포함하지 않는가
    weight: 0.1

exit_conditions:
  - name: 데이터 불변식 통과
    description: 모든 시나리오 세트가 원인 연결·기여도 합·정답 유일성 불변식 자동 검증을 통과
    criteria: validate-scenarios가 오류 0으로 통과
  - name: 핵심 플레이 흐름 완성
    description: 3~5턴 세션, 선택→공개 채점, 현금흐름 화면, 결산 집계가 동작
    criteria: 6개 수용 기준의 관찰 가능한 상태가 모두 참
  - name: 사용자 검증 합격선 도달
    description: 4명 검증자 기준 환산 성공 기준 충족
    criteria: 3/4 무설명 첫 턴 완주, 3/4 지표 2개 이상 자기 말 설명, 2/4 최대 영향 원인 선택, 3/4 "부담 적다" 평가, 2/4 재플레이
  - name: 범위 초과 방지
    description: 제외 범위 기능이 포함되면 종료 보류
    criteria: 경험치/레벨업/해금, 부동산/도시, 로그인/서버저장/모바일앱, 랜덤생성 중 어느 것도 구현되지 않음

