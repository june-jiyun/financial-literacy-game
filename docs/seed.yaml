goal: 금융 초보자가 가상 월급으로 주식 3~5턴을 직접 플레이하고, 각 턴의 주가 변동 원인을 지표와 함께 이해하도록, 백엔드 없이 링크로 실행되는 정적 웹(React+TypeScript) 금융 학습 시뮬레이션 MVP를 만든다.

task_type: code

brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []

constraints:
  - 기술 스택은 React + TypeScript, 브라우저에서 설치 없이 링크로 실행되는 정적 웹으로 배포 가능해야 한다
  - 백엔드·서버·데이터베이스 없음; 프론트엔드만으로 완결
  - 시나리오는 정적 JSON 데이터 파일로 관리하며 코드에 하드코딩하지 않는다
  - "고정 시나리오 2~3세트(A/B/C): 1회차는 전원 A 세트 고정, 재플레이 시 B→C 순 전환, 런타임 랜덤/절차적 생성 없음"
  - 한 세션 = 3~5턴(1턴 = 게임 내 1개월), 총 플레이 시간 15분 내외, 세션 종료 시 결산 화면 제공
  - 모든 턴의 모든 주가 변동에는 1개 이상의 원인 카드가 연결되어야 하며 이 연결은 자동 검증 가능해야 한다
  - 한 턴의 원인 카드 기여도(%p) 합은 그 턴 주가 변동률과 일치해야 한다(정확 일치 또는 명시적 소수점 자리 규칙)
  - 각 턴에서 기여도 절댓값 최댓값은 유일해야 한다(정답 원인 항상 유일, 동점 금지)
  - 채점 퀴즈는 턴당 정확히 1회, 대상은 그 턴에 투자(매수/보유)한 기업 1개; 투자 대상이 없으면 변동폭 절댓값이 가장 큰 기업
  - "채점 순서는 선택→공개: impact_ticks 수치는 플레이어 선택 이전까지 UI에 노출 금지, 선택 후 정오답과 전체 기여도를 함께 공개"
  - 선택한 원인은 연결 지표(linked_indicator)와 함께 표시한다
  - 개인 현금흐름 화면은 월급·생활비·현금·투자금·수익/손실을 한 화면에서 보여준다
  - 선택 정오답은 결산 화면에서 "n턴 중 m턴 정답"으로 집계한다
  - 검증 대상자는 4명이며 환산된 합격선이 최종 기준이다

