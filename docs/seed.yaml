    semantic_ac_key: ac_f6a3e2d52fe934b7
    expected_artifacts:
      - dist/index.html

ontology_schema:
  name: StockTurnScenario
  description: 원인 기반 주식 투자 학습 게임의 도메인 모델. 두 계층으로 구성된다 — authored 계층은 정적 JSON 시나리오 파일에 저작되어 validate-scenarios가 검사하는 불변 데이터이고, runtime 계층은 플레이 중 생성되어 화면과 결산에만 존재하는 세션 상태다. 시나리오 파일의 필수 필드는 authored 계층뿐이다.
  fields:
    - name: scenario_set_id
      layer: authored
      type: string
      description: 시나리오 세트 식별자 (A/B/C)
      required: true
    - name: turn_index
      layer: authored
      type: number
      description: 턴 번호 = 게임 내 개월 (세션당 3~5)
      required: true
    - name: companies
      layer: authored
      type: array
      description: 가상 기업 3개 목록 (고정)
      required: true
    - name: indicators
      layer: authored
      type: object
      description: "기업 지표 5종: 매출, 영업이익, 부채비율, PER, 외국인·기관 순매수"
      required: true
    - name: price_change_rate
      layer: authored
      type: number
      description: 해당 턴 기업의 실제 주가 변동률(%)
      required: true
    - name: cause_cards
      layer: authored
      type: array
      description: "변동에 연결된 CauseCard 배열; 각 카드 = {id, label, impact_ticks(%p 기여도), linked_indicator(연결 지표)}. 기여도와 지표는 이 카드 안에만 존재한다"
      required: true
    - name: correct_cause_id
      layer: authored
      type: string
      description: 정답 원인 카드 id. 데이터에 명시하며, validate-scenarios가 cause_cards의 기여도 절댓값 최댓값과 일치하는지 검사한다
      required: true
    - name: cashflow
      layer: authored+runtime
      type: object
      description: "개인 현금흐름 상태: 월급, 생활비, 현금, 투자금, 손익. 세트별 초기값은 시나리오 파일에 저작되고 턴 진행 중 갱신값은 세션 상태로 유지된다"
      required: true
    - name: player_action
      layer: runtime
      type: string
      description: "턴 투자 선택: 매수/보유/매도/보류. 플레이어 입력으로만 생성된다"
      required: false
    - name: quiz_target_company
      layer: runtime
      type: string
      description: 턴당 1회 채점 대상 기업. player_action에서 파생된다(투자 기업, 없으면 변동폭 절댓값 최대 기업)
      required: false
    - name: player_selected_cause_id
      layer: runtime
      type: string
      description: 플레이어가 최대 영향 원인으로 선택한 카드 id. 선택 이전에는 미설정이며, 이 값이 설정되기 전까지 impact_ticks를 노출하지 않는다
      required: false
    - name: turn_quiz_correct
      layer: runtime
      type: boolean
      description: 해당 턴 채점 결과 (player_selected_cause_id == correct_cause_id)
      required: false
    - name: session_score
      layer: runtime
      type: object
      description: "세션 누적 채점 결과: correct(정답 턴 수), total(채점 턴 수). 결산 화면의 'n턴 중 m턴 정답' 근거"
      required: false

evaluation_principles:
  - name: 원인-지표 연결성
    description: 모든 주가 변동이 사전 정의된 원인 카드 및 연결 지표로 설명되어 "지표와 함께 이해" 목표를 충족하는가
    weight: 0.3
  - name: 데이터 정합성
    description: 기여도 합 = 변동률, 정답 원인 유일성 등 불변식이 자동 검증을 통과하는가
    weight: 0.25
  - name: 학습 측정 가능성
    description: 선택→공개 채점 흐름과 결산 집계가 성공 기준을 관찰자가 측정할 수 있게 만드는가
    weight: 0.2
  - name: 검증 접근성
    description: 설치 없이 링크로 4명 검증자가 15분 내 완주 가능한 정적 웹으로 배포되는가
    weight: 0.15
  - name: MVP 범위 준수
    description: 경험치·레벨업·부동산·서버 등 제외 범위를 포함하지 않는가
    weight: 0.1

exit_conditions:
  - name: 데이터 불변식 통과
    description: 모든 시나리오 세트가 원인 연결·기여도 합·정답 유일성 불변식 자동 검증을 통과
    criteria: validate-scenarios가 오류 0으로 통과
  - name: 핵심 플레이 흐름 완성
    description: 3~5턴 세션, 선택→공개 채점, 현금흐름 화면, 결산 집계, 재플레이 세트 전환이 동작
    criteria: 6개 수용 기준의 관찰 가능한 상태가 모두 참
  - name: 사용자 검증 합격선 도달
    description: 4명 검증자 기준 환산 성공 기준 충족
    criteria: 3/4 무설명 첫 턴 완주, 3/4 지표 2개 이상 자기 말 설명, 2/4 최대 영향 원인 선택, 3/4 "부담 적다" 평가, 2/4 재플레이
  - name: 범위 초과 방지
    description: 제외 범위 기능이 포함되면 종료 보류
    criteria: 경험치/레벨업/해금, 부동산/도시, 로그인/서버저장/모바일앱, 랜덤생성 중 어느 것도 구현되지 않음

